name: Yuki 24/7 Facebook Scanner

on:
  schedule:
    - cron: '*/10 0-16 * * *' # Chạy mỗi 10 phút từ 07:00 đến 23:50 giờ Việt Nam
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cài đặt thư viện
        run: |
          pip install -r requirements.txt
          playwright install chromium
      - name: Quét 29 Fanpage
        run: python yuki_monitor.py
      - name: Lưu lịch sử bài đã quét
        run: |
          git config user.name "Yuki Bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen_gh_posts.json || true
          git commit -m "Update seen posts" || exit 0
          git push
